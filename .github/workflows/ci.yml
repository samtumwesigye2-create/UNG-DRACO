name: DRACO CI

on:
  push:
    branches: [main, feat/task-1-foundation, feat/task-2-schema]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: draco
          POSTGRES_PASSWORD: draco
          POSTGRES_DB: draco_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U draco -d draco_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      DATABASE_URL: postgresql+psycopg://draco:draco@localhost:5432/draco_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: alembic upgrade head
      - run: python -m pytest tests -v
