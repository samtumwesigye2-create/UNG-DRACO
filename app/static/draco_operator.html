<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>DRACO Live Operator</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#080b0e;color:#e9eef2;font-family:system-ui,-apple-system,sans-serif}.top{height:64px;display:flex;align-items:center;justify-content:space-between;padding:0 24px;border-bottom:1px solid #26313a}.brand{font-weight:800;letter-spacing:.16em}.state{font-size:13px;padding:7px 11px;border:1px solid #34434e;border-radius:999px}.grid{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:16px;padding:16px;min-height:calc(100vh - 64px)}.viewer,.panel{background:#0e1419;border:1px solid #26313a;border-radius:14px}.viewer{position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;min-height:520px}video{width:100%;height:100%;object-fit:contain;background:#000}.overlay{position:absolute;top:14px;left:14px;background:#071015cc;padding:8px 10px;border-radius:8px;font-size:12px}.panel{padding:16px}.panel h2{font-size:14px;margin:0 0 14px;color:#aebbc4}.metric{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid #222d35}.controls{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:16px 0}button,select,input{background:#172129;color:#eef;border:1px solid #34434e;border-radius:9px;padding:11px}button{cursor:pointer}button:disabled{opacity:.35;cursor:not-allowed}.wide{width:100%;margin:5px 0}.lost{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:#05090dcc;font-weight:800;letter-spacing:.08em}.lost.show{display:flex}@media(max-width:800px){.grid{grid-template-columns:1fr}.viewer{min-height:360px}}
</style>
</head>
<body>
<header class="top"><div class="brand">UNG · DRACO</div><div id="stream-state" class="state">OFFLINE</div></header>
<main class="grid">
<section class="viewer"><video id="live-video" autoplay playsinline muted></video><div class="overlay"><span id="unit-label">NO UNIT</span> · <span id="quality-label">720p / 30</span></div><div id="link-lost" class="lost">LINK LOST — RECONNECTING</div></section>
<aside class="panel">
<h2>LIVE LINK</h2>
<input id="unit-id" class="wide" value="draco-mini-001" aria-label="DRACO unit ID">
<button id="connect" class="wide">CONNECT</button>
<div class="metric"><span>Latency</span><strong id="latency">—</strong></div><div class="metric"><span>Connection</span><strong id="connection-quality">OFFLINE</strong></div>
<h2 style="margin-top:20px">MANUAL CAMERA</h2>
<div class="controls"><span></span><button data-command="TILT_UP">▲</button><span></span><button data-command="PAN_LEFT">◀</button><button data-command="CENTER">HOME</button><button data-command="PAN_RIGHT">▶</button><span></span><button data-command="TILT_DOWN">▼</button><span></span></div>
<button id="snapshot" class="wide">SNAPSHOT</button><button id="recording" class="wide">START RECORDING</button>
<select id="quality" class="wide"><option value="720">720p / 30</option><option value="480">480p / 30</option><option value="360">360p / 24</option></select>
<button id="fullscreen" class="wide">FULLSCREEN</button>
</aside></main>
<script src="/static/draco_operator.js"></script>
</body></html>
