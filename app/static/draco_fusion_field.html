<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DRACO Fusion Field</title><style>
*{box-sizing:border-box}body{margin:0;background:#020806;color:#c8ffe0;font-family:ui-monospace,monospace}header{padding:15px 20px;border-bottom:1px solid #155b39;display:flex;justify-content:space-between}.brand{font-weight:900;letter-spacing:.18em;color:#6dffad}main{padding:16px;max-width:1400px;margin:auto}.grid{display:grid;grid-template-columns:2fr 1fr;gap:12px}.card{background:#06120d;border:1px solid #155b39;padding:14px}.field{height:560px;position:relative;overflow:hidden;background:radial-gradient(circle at center,#0b2a1b 0,#04110b 45%,#020806 75%)}canvas{width:100%;height:100%}.stats{display:grid;gap:10px}.row{display:flex;justify-content:space-between;border-bottom:1px solid #103c28;padding:10px 0}.sensor{padding:12px;border:1px solid #155b39;margin-top:8px}.good{color:#6dffad}.warn{color:#ffd166}.bad{color:#ff6b6b}a{color:#91ffc1}@media(max-width:850px){.grid{grid-template-columns:1fr}.field{height:420px}}</style></head><body>
<header><div class="brand">UNG · DRACO // FUSION FIELD</div><a href="/">COMMAND</a></header><main><div class="grid"><section class="card field"><canvas id="field"></canvas></section><aside class="card"><h2>LIVE FUSED STATE</h2><div class="stats"><div class="row"><span>STATE</span><b id="status">WAITING</b></div><div class="row"><span>CONFIDENCE</span><b id="confidence">—</b></div><div class="row"><span>ENVELOPE</span><b id="envelope">—</b></div><div class="row"><span>ANOMALY</span><b id="anomaly">NO</b></div><div id="sensors"></div></div></aside></div></main>
<script>
const c=document.getElementById('field'),x=c.getContext('2d');let state={};
function resize(){c.width=c.clientWidth*devicePixelRatio;c.height=c.clientHeight*devicePixelRatio;x.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0)}addEventListener('resize',resize);resize();
function draw(){const w=c.clientWidth,h=c.clientHeight;x.clearRect(0,0,w,h);x.strokeStyle='#155b39';x.lineWidth=1;for(let i=0;i<=20;i++){x.beginPath();for(let j=0;j<=20;j++){let px=w*j/20,py=h*i/20;if(state.focus){const dx=px-w/2,dy=py-h/2,d=Math.sqrt(dx*dx+dy*dy)||1,pull=70*Math.exp(-d/180);px-=dx/d*pull;py-=dy/d*pull}j?x.lineTo(px,py):x.moveTo(px,py)}x.stroke()}for(let j=0;j<=20;j++){x.beginPath();for(let i=0;i<=20;i++){let px=w*j/20,py=h*i/20;if(state.focus){const dx=px-w/2,dy=py-h/2,d=Math.sqrt(dx*dx+dy*dy)||1,pull=70*Math.exp(-d/180);px-=dx/d*pull;py-=dy/d*pull}i?x.lineTo(px,py):x.moveTo(px,py)}x.stroke()}if(state.focus){const r=Math.max(22,Math.min(130,(state.envelope_radius||1)*12));x.beginPath();x.arc(w/2,h/2,r,0,Math.PI*2);x.strokeStyle=state.anomaly?'#ff6b6b':'#37e984';x.lineWidth=2;x.stroke();x.beginPath();x.arc(w/2,h/2,5,0,Math.PI*2);x.fillStyle='#6dffad';x.fill()}requestAnimationFrame(draw)}draw();
function render(s){state=s;status.textContent=(s.status||'waiting').toUpperCase();confidence.textContent=s.confidence==null?'—':Math.round(s.confidence*100)+'%';envelope.textContent=s.envelope_radius==null?'—':s.envelope_radius.toFixed(2);anomaly.textContent=s.anomaly?'DETECTED':'NO';anomaly.className=s.anomaly?'bad':'good';sensors.innerHTML='';for(const id of ['S1','S2','S3']){const v=s.sensors?.[id];const e=document.createElement('div');e.className='sensor';e.innerHTML='<b>'+id+'</b><div class="row"><span>STATUS</span><span class="'+(v?'good':'warn')+'">'+(v?'ACTIVE':'WAITING')+'</span></div><div class="row"><span>WEIGHT</span><span>'+(v?Math.round(v.weight*100)+'%':'—')+'</span></div><div class="row"><span>QUALITY</span><span>'+(v?Math.round(v.quality*100)+'%':'—')+'</span></div>';sensors.appendChild(e)}}
function connect(){const ws=new WebSocket((location.protocol==='https:'?'wss://':'ws://')+location.host+'/api/draco/v1/fusion-field/stream');ws.onmessage=e=>render(JSON.parse(e.data));ws.onclose=()=>setTimeout(connect,1500)}connect();
</script></body></html>
